<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Alerts</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg-color: light-dark(#ffffff, #1a1a1a);
            --text-color: light-dark(#333333, #e0e0e0);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 32px;
            line-height: 1.6;
        }

        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 32px; margin-bottom: 32px; }

        .alert {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid transparent;
        }

        .alert svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .alert-primary { background-color: #cfe2ff; color: #084298; border-color: #b6d4fe; }
        .alert-success { background-color: #d1e7dd; color: #0f5132; border-color: #badbcc; }
        .alert-danger { background-color: #f8d7da; color: #842029; border-color: #f5c2c7; }
        .alert-warning { background-color: #fff3cd; color: #664d03; border-color: #ffecb5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alerts</h1>

        <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
            <symbol id="info-fill" viewBox="0 0 16 16">
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
            </symbol>
            <symbol id="check-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </symbol>
            <symbol id="exclamation-fill" viewBox="0 0 16 16">
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM8 4a.905.905 0 0 1 .9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995A.905.905 0 0 1 8 4zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </symbol>
            <symbol id="x-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
            </symbol>
        </svg>

        <div class="alert alert-primary" role="alert">
            <svg><use href="#info-fill"/></svg>
            <div>Um exemplo de alerta com um icone</div>
        </div>
        <div class="alert alert-success" role="alert">
            <svg><use href="#check-fill"/></svg>
            <div>Um exemplo de alerta de sucesso com um icone</div>
        </div>

        <div class="alert alert-danger" role="alert">
            <svg><use href="#x-circle-fill"/></svg>
            <div>Um exemplo de alerta de aviso com um icone</div>
        </div>

        <div class="alert alert-warning" role="alert">
            <svg><use href="#exclamation-fill"/></svg>
            <div>Um exemplo de peri de perigo com um icone</div>
        </div>
    </div>
</body>
</html>
