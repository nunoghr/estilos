<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 - Listas</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        padding: 32px;
    }

    .list-group {
        list-style: decimal;
        max-width: 500px;
        margin: 0 auto;
        padding: 0;
    }

    .list-group-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        margin-bottom: 8px;
        background-color: white;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    .item-content {
        display: flex;
        flex-direction: column;
    }

    .subheading {
        font-weight: bold;
        margin-bottom: 4px;
    }

    .badge {
        background-color: #007bff;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 14px;
    }
</style>
</head>
<body>

<ul class="list-group">
    <li class="list-group-item">
        <div class="item-content">
            <span class="subheading">Subheading</span>
            <span>Content for list item</span>
        </div>
    </li>
    <li class="list-group-item">
        <div class="item-content">
            <span class="subheading">Subheading</span>
            <span>Content for list item</span>
        </div>
    </li>
    <li class="list-group-item">
        <div class="item-content">
            <span class="subheading">Subheading</span>
            <span>Content for list item</span>
        </div>
    </li>
</ul>

</body>
</html>
