<!DOCTYPE html>
<html lang="en">

<button type="button" class="btn btn-primary position-relative inbox-button">
  Inbox
  <span class="badge rounded-pill bg-danger inbox-badge">
    99+
    <span class="visually-hidden">unread messages</span>
  </span>
</button>

<style>
  .inbox-button {
    position: relative;
    padding: 8px 16px;
    font-size: 16px;
    border: none;
    border-radius: 4px;
    background-color: #007bff;
    color: white;
    cursor: pointer;
  }

  .inbox-badge {
    position: absolute;
    top: 0;
    right: 0;
    transform: translate(50%, -50%);
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 50%;
    background-color: #dc3545;
    color: white;
    min-width: 18px;
    text-align: center;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
