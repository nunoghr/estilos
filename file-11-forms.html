<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 - Formulários</title>
<style>
    :root {
        color-scheme: light dark;
        --bg-color: light-dark(#ffffff, #1a1a1a);
        --text-color: light-dark(#333333, #e0e0e0);
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: light-dark();
        padding: 32px; 
    }

    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 32px; margin-bottom: 32px; text-align: center; } 

    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .form-control, .form-select {
        display: block;
        width: 100%;
        padding: 8px 12px; 
        font-size: 16px; 
        line-height: 24px; 
        color: #333;
        border: 2px solid #ccc;
        border-radius: 4px; 
        margin-bottom: 16px; 
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus, .form-select:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 3.2px rgba(0,123,255,0.25); 
        outline: none;
    }

    .form-check {
        display: flex;
        align-items: center;
        gap: 8px; 
        margin-bottom: 16px; 
    }

    .form-check-input {
        width: 19.2px; 
        height: 19.2px; 
        cursor: pointer;
        accent-color: #007bff;
    }

    .btn {
        padding: 8px 24px; 
        background-color: #007bff;
        color: white;
        border: none;
        font-size: 16px; 
        transition: background 0.2s, transform 0.2s;
    }

    .btn:hover {
        background-color: #0056b3;
        transform: translateY(-1px);
    }

    .form-row {
        display: flex;
        gap: 16px; 
    }

    .form-row > .form-group {
        flex: 1;
    }

    @media (max-width: 500px) {
        .form-row {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
<div class="container">
    <h1>Formulário</h1>

    <form>
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="nome">

        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email">

        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password">

        <label for="morada" class="form-label">Morada</label>
        <input type="text" class="form-control" id="morada" placeholder="Rua Principal, 123">

        <div class="form-row">
            <div class="form-group">
                <label for="cidade" class="form-label">Cidade</label>
                <select id="cidade" class="form-select">
                    <option selected>Escolher...</option>
                    <option>Lisboa</option>
                    <option>Porto</option>
                    <option>Coimbra</option>
                    <option>Funchal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="zip" class="form-label">Código Postal</label>
                <input type="text" class="form-control" id="zip" placeholder="1234-567">
            </div>
        </div>
        
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="termos">
            <label class="form-check-label" for="termos">Aceito os termos e condições</label>
        </div>
        <button type="submit" class="btn">Submeter</button>
    </form>
</div>
</body>
</html>
